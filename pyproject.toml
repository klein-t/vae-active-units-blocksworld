[project]
name = "pw-deep-learning"
version = "0.1.0"
description = "Beta-VAEs on Blocksworld states: active latent units against a known state space"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
    "transformer-lens==2.15.4",
    "transformers>=4.37.0,<5.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
